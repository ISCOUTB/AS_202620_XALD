name: Android CI

on:
  push:
    branches: [ "experimental", "master" ]
  pull_request:
    branches: [ "experimental", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew
        working-directory: XALDAPP

      - name: Ejecutar pruebas unitarias de los módulos
        run: ./gradlew testDebugUnitTest
        working-directory: XALDAPP
        
      - name: Instalar Redocly CLI
        run: npm install -g @redocly/cli@1.25.0

      - name: Validar contrato OpenAPI
        run: redocly lint docs/api/openapi.yaml
