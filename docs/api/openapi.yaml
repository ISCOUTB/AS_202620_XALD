openapi: 3.1.0
info:
  title: API de Sincronización Financiera - Proyecto XALD
  description: >
    API REST para la recepción de transacciones financieras sincronizadas
    por el cliente móvil bajo una arquitectura Offline-First.
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo XALD
  license:
    name: Propietaria
    url: https://xald-app.com/licencia

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local (Express, backend_xald/index.js)

paths:
  /sync:
    post:
      summary: Sincronizar una transacción financiera pendiente
      description: >
        Recibe el payload de sincronización enviado por :syncqueue
        y confirma su recepción.
      operationId: sincronizarTransaccion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadSincronizacionDTO'
      responses:
        '200':
          description: Transacción recibida y confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSincronizacion'

components:
  schemas:
    PayloadSincronizacionDTO:
      type: object
      required:
        - idTransaccion
        - monto
        - comercio
        - fechaTimestamp
      properties:
        idTransaccion:
          type: string
          description: Identificador único de la transacción.
        monto:
          type: number
          format: double
          description: Valor numérico de la transacción.
        comercio:
          type: string
          description: Nombre del comercio asociado a la transacción.
        fechaTimestamp:
          type: integer
          format: int64
          description: Timestamp (epoch, milisegundos) de la transacción.

    RespuestaSincronizacion:
      type: object
      properties:
        status:
          type: string
          example: success
        synced_at:
          type: string
          format: date-time
          description: Timestamp ISO 8601 generado por el backend al responder.
