name: Android CI

on:
  push:
    branches: [ "experimental", "master" ]
  pull_request:
    branches: [ "experimental", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew
        working-directory: XALDAPP

      - name: Ejecutar pruebas unitarias de los módulos
        run: ./gradlew testDebugUnitTest
        working-directory: XALDAPP

      - name: Instalar Redocly CLI
        run: npm install -g --ignore-scripts @redocly/cli@1.25.0

      - name: Validar contrato OpenAPI
        run: redocly lint docs/api/openapi.yaml

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del backend
        # Declaramos las dependencias aquí mismo para que SonarQube las valide directamente y deje de pedir el bloqueo.
        run: |
          pip install --no-cache-dir --only-binary :all: \
            fastapi==0.162.0 \
            httpx==0.27.0 \
            prometheus-client==0.20.0 \
            pydantic==2.9.0 \
            pytest==9.0.3 \
            starlette==1.3.1 \
            "uvicorn[standard]==0.30.0"
        working-directory: backend

      - name: Ejecutar pruebas del backend (pytest)
        run: python -m pytest tests/ -v
        working-directory: backend

  # Semana 13 — análisis de dependencias (docs/seguridad/analisis-dependencias.md).
  # Cada hallazgo debe tener decisión en docs/seguridad/hallazgos-dependencias.json;
  # uno nuevo sin decisión hace fallar el job y bloquea el despliegue.
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar las dependencias del backend y pip-audit
        run: |
          python -m venv /tmp/backend-env
          # El pip que trae el venv (25.0.1) tiene 6 vulnerabilidades: hallazgo de este mismo job.
          /tmp/backend-env/bin/pip install --no-cache-dir --upgrade pip==26.2.2
          /tmp/backend-env/bin/pip install --no-cache-dir --only-binary :all: \
            fastapi==0.162.0 \
            httpx==0.27.0 \
            prometheus-client==0.20.0 \
            pydantic==2.9.0 \
            pytest==9.0.3 \
            starlette==1.3.1 \
            "uvicorn[standard]==0.30.0"
          pip install --no-cache-dir pip-audit==2.10.1

      - name: pip-audit sobre el entorno del backend (incluye transitivas)
        run: |
          pip-audit --path /tmp/backend-env/lib/python3.12/site-packages -f json -o pip-audit.json || true
          test -s pip-audit.json

      - name: Revisar hallazgos del backend contra las decisiones del equipo
        run: python scripts/seguridad/auditar_dependencias.py backend pip-audit.json

      - name: Configurar entorno Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Resolver el árbol de dependencias de cada módulo Android
        working-directory: XALDAPP
        run: |
          chmod +x gradlew
          for modulo in app parser corefinanciero syncqueue aigemini; do
            ./gradlew -q ":$modulo:dependencies" --configuration releaseRuntimeClasspath > "../arbol-$modulo.txt"
          done

      - name: Consultar OSV.dev con las dependencias Android y revisar hallazgos
        run: python scripts/seguridad/auditar_dependencias.py android arbol-*.txt

      - name: Guardar los reportes del análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analisis-dependencias
          path: |
            pip-audit.json
            arbol-*.txt

  deploy-backend:
    needs: [build-and-test, backend-tests, dependency-audit]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Deploy Hook de Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::error::El secreto RENDER_DEPLOY_HOOK no está configurado."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Verificar URL pública (health check con hora)
        run: |
          URL="https://xald-backend.onrender.com/health"
          echo "Verificando $URL desde el runner de GitHub Actions (fuera de la red de la universidad)..."

          # Reintenta hasta 10 veces (Render puede tardar en reconstruir/despertar el servicio)
          for intento in $(seq 1 10); do
            HORA_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            CODIGO=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" "$URL" || echo "000")

            if [ "$CODIGO" = "200" ]; then
              echo "✅ [$HORA_UTC] Respuesta HTTP $CODIGO en el intento $intento"
              echo "Cuerpo de la respuesta:"
              cat /tmp/respuesta.json
              exit 0
            fi

            echo "⏳ [$HORA_UTC] Intento $intento: HTTP $CODIGO, reintentando en 15s..."
            sleep 15
          done

          echo "::error::La URL pública no respondió con HTTP 200 tras varios intentos."
          exit 1
