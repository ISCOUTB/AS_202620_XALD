openapi: 3.1.0
info:
  title: API de Sincronización Financiera - Proyecto XALD
  description: >
    API REST asíncrona para la recepción de transacciones financieras procesadas
    por el cliente móvil bajo una arquitectura Offline-First. Garantiza la ingesta
    higienizada de datos provenientes de la capa Anti-Corrupción (ACL / Regex / Gemini).
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo XALD
  license:
    name: Propietaria
    url: https://xald-app.com/licencia

servers:
  - url: https://xald-backend.onrender.com
    description: Servidor de Producción (Render)

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health check del servicio
      description: >
        Endpoint público (sin autenticación) usado por Render para verificar que el
        servicio está en línea (`healthCheckPath` en render.yaml).
      operationId: health
      security: []
      responses:
        '200':
          description: El servicio está en línea.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /metrics:
    get:
      summary: Métricas en formato Prometheus
      description: >
        Expone las métricas de la API en el formato de texto de Prometheus, incluyendo
        el contador `xald_sync_conflictos_resueltos_total` (ESC-05).
      operationId: metrics
      security: []
      responses:
        '200':
          description: Métricas en formato de texto Prometheus.
          content:
            text/plain:
              schema:
                type: string

  /api/v1/transacciones:
    post:
      summary: Recibir transacción financiera desde la cola de sincronización
      description: >
        Endpoint asíncrono que recibe los DTOs de transacciones encolados en el dispositivo móvil.
        Aplica validación estricta de esquemas y responde inmediatamente con un estado de aceptación
        para procesamiento en segundo plano (Eventual Consistency).
      operationId: registrarTransaccion
      parameters:
        - $ref: '#/components/parameters/IdCorrelacion'
        - $ref: '#/components/parameters/VersionEsquema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransaccionDTO'
      responses:
        '202':
          description: >
            Transacción aceptada. Un reenvío idéntico (mismo id_transaccion y misma
            fecha_transaccion) devuelve la misma respuesta sin cambiar el estado (idempotente).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/IdCorrelacion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSincronizacion'
        '400':
          description: >
            Petición inválida o versión de esquema no soportada (X-Version-Esquema). Error
            permanente: el cliente no reintenta y manda el mensaje a su cola de fallidos.
        '401':
          description: API key ausente o inválida. Error permanente para el cliente.
        '422':
          description: >
            El cuerpo no cumple el contrato (falta un campo obligatorio, tipo incorrecto, monto <= 0).
            Error permanente para el cliente.
        '503':
          description: >
            Servicio no disponible (por ejemplo, Render despertando). Error recuperable: el
            cliente reintenta con espera exponencial.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    IdCorrelacion:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador del mensaje en la cola del dispositivo. No cambia entre reintentos y se
        registra en cada línea de log del backend. Si no llega, el backend genera uno.
      schema:
        type: string
        example: 345f6ac8-b24f-4259-b029-9ac4e33efa39
    VersionEsquema:
      name: X-Version-Esquema
      in: header
      required: false
      description: >
        Versión mayor del contrato del mensaje (docs/mensajes/README.md). Si se omite se asume 1.
      schema:
        type: string
        enum: ['1']
        default: '1'

  headers:
    IdCorrelacion:
      description: El mismo X-Correlation-Id de la petición, o el generado por el backend.
      schema:
        type: string

  schemas:
    TransaccionDTO:
      type: object
      description: >
        Contrato v1 del mensaje transaccion.registrada. Los campos desconocidos se ignoran
        (regla de compatibilidad hacia adelante, docs/mensajes/README.md).
      required:
        - id_transaccion
        - monto
        - moneda
        - comercio
        - categoria
        - fecha_transaccion
        - origen_datos
      properties:
        id_transaccion:
          type: string
          format: uuid
          description: Identificador único universal (UUID)
        monto:
          type: number
          format: float
          exclusiveMinimum: 0
          description: Valor numérico de la transacción
        moneda:
          type: string
          minLength: 3
          maxLength: 3
          example: COP
        comercio:
          type: string
          minLength: 1
          example: Tienda Ara
        categoria:
          type: string
          minLength: 1
          example: Supermercado
        fecha_transaccion:
          type: string
          format: date-time
          description: Estampa de tiempo ISO 8601 UTC
        origen_datos:
          $ref: '#/components/schemas/OrigenDatosEnum'

    RespuestaSincronizacion:
      type: object
      properties:
        estado:
          type: string
          example: ACEPTADO
        id_transaccion:
          type: string
          format: uuid
        mensaje:
          type: string
          example: Transacción recibida y encolada exitosamente para persistencia.
        fecha_recepcion:
          type: string
          format: date-time

    OrigenDatosEnum:
      type: string
      enum:
        - SMS_REGEX
        - AI_GEMINI
        - MANUAL
